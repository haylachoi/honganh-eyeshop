proxy_pass http://backend_app;
proxy_http_version 1.1;

proxy_set_header Accept-Encoding $disable_encoding;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_set_header Connection ""; # để giữ kết nối keep-alive

# Timeout đọc và gửi dữ liệu
proxy_read_timeout 60s;
proxy_send_timeout 60s;

# Timeout kết nối tới backend khi thiết lập TCP (mặc định 60s, có thể giảm nếu muốn)
# proxy_connect_timeout 10s;

# Giới hạn kích thước response header nhận từ backend (mặc định 4k, tăng nếu backend gửi header lớn)
# proxy_buffer_size 8k;

# Bộ đệm lưu response từ backend (mặc định 4k hoặc 8k), tăng giúp backend trả dữ liệu lớn ổn định hơn
# proxy_buffers 4 16k;

# Giới hạn kích thước tối đa của response header từ backend (mặc định 8k)
# proxy_busy_buffers_size 24k;

# Nếu backend trả quá lớn, có thể giới hạn body tải về tránh hết bộ nhớ
# proxy_max_temp_file_size 1024m;

# Nếu backend trả lỗi, có thể tùy chỉnh lỗi trả về cho client
# proxy_intercept_errors on;

# Tắt hoặc bật tùy ý theo use case, để tăng hiệu quả cache hoặc giảm độ trễ
# proxy_cache ... 
# proxy_cache_valid ...


