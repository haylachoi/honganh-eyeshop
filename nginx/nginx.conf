load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

worker_processes auto;

events {
    worker_connections 4096;  # hoặc cao hơn nếu bạn xử lý nhiều kết nối
    # multi_accept on;          # chấp nhận nhiều connection cùng lúc nếu có, bật khi cpu khỏe
    use epoll;                # chỉ trên Linux, thường sẽ tự động bật trên linux hiện đại
}

http {
  keepalive_timeout 40;          # Giữ kết nối với client (browser) trong 65 giây nhàn rỗi
  keepalive_requests 1000;       # Tối đa 1000 request cho mỗi kết nối keep-alive

  # sendfile on; # khi nginx phục vụ file tĩnh
  # tcp_nopush on; # đi kèm sendfile
  tcp_nodelay on; # giảm độ trễ phản hồi TCP, đặc biệt khi xử lý các kết nối keep-alive, proxy, API.



  types_hash_max_size 4096;
  types_hash_bucket_size 64; # hoặc 128

  include       mime.types;
  default_type  application/octet-stream;

  # Limit theo điều kiện header Next-Action
  map $http_next_action $limit_key {
    default $binary_remote_addr;
    ""      "";
  }

  limit_req_zone $limit_key zone=next_action_limit:10m rate=1r/s;
  limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=1r/s;

  map $http_rsc $disable_encoding {
    "1" $http_accept_encoding;
    default "";
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;

  brotli on;
  brotli_static on;
  brotli_comp_level 6;
  brotli_types text/plain text/css application/javascript application/json image/svg+xml application/xml+rss;


  upstream backend_app {
    server app:3000;
    # keep-alive timeout sẽ dc config ở backend
    keepalive 32;
  }

  server {
    listen 80;
    server_name localhost;

    # Ngăn trang web bị load trong iframe của domain khác, chống clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Ngăn trình duyệt tự động đoán kiểu MIME, tránh lỗi kiểu dữ liệu và bảo vệ khỏi khai thác
    add_header X-Content-Type-Options "nosniff" always;

    # Kiểm soát thông tin referrer gửi đi, tăng bảo mật và bảo vệ quyền riêng tư
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Chính sách bảo mật nội dung (CSP) giới hạn nguồn tải script, style, giúp chống XSS
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'" always;

    # Giới hạn quyền truy cập thiết bị như camera và microphone, tăng quyền riêng tư
    add_header Permissions-Policy "camera=(), microphone=()" always;

    # Bật Strict-Transport-Security (HSTS) để yêu cầu trình duyệt chỉ dùng HTTPS trong tương lai
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;



    location /_next/static/ {
      # root /app/.next;  # CHÚ Ý: không phải là /app/.next/static
      alias /app/.next/static/; # alias sẽ thay thế chứ ko nối như root
      access_log off;
      add_header Cache-Control "public,max-age=31536000,immutable";
    }

    location = /login {
      limit_req zone=login_limit burst=1 nodelay;
      include /etc/nginx/conf.d/default-location.conf;
    }

    location ~ ^/(signup|forgot-password|reset-password|active-account)$ {
      limit_req zone=auth_limit burst=2 nodelay;
      include /etc/nginx/conf.d/default-location.conf;
    }

    location ^~ /checkout {
      limit_req zone=next_action_limit burst=2 nodelay;
      include /etc/nginx/conf.d/default-location.conf;
    }


    location ^~ /c {
      limit_req zone=next_action_limit burst=2 delay=1;
      include /etc/nginx/conf.d/default-location.conf;
    }

    location ^~ /cart {
      limit_req zone=next_action_limit burst=2 nodelay;
      include /etc/nginx/conf.d/default-location.conf;
    }

    location ^~ /admin {
      limit_req zone=next_action_limit burst=3 delay=2;
      include /etc/nginx/conf.d/default-location.conf;
    }

    location ^~ ^/api/dashboard {
      deny all;
    }

    location ^~ /api/search-engine {
      deny all;
    }

    location ^~ /api {
      limit_req zone=api_limit burst=9 delay=6;
      include /etc/nginx/conf.d/default-location.conf;
    }

    location / {
      include /etc/nginx/conf.d/default-location.conf;
    }
  }
}

